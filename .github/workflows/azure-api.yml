# Construye la imagen del API y la publica en GitHub Container Registry (GHCR).
# Azure App Service (Linux, contenedor) la descarga desde ghcr.io.
#
# No requiere secretos adicionales: usa el GITHUB_TOKEN del propio workflow.
# Imagen resultante: ghcr.io/efraingon/sistema-pago-api:latest

name: Build API (imagen Docker)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/azure-api.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/efraingon/sistema-pago-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
