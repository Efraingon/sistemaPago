# Construye la imagen del API y la publica en GitHub Container Registry (GHCR).
# Azure App Service (Linux, contenedor) la descarga desde ghcr.io.
#
# No requiere secretos adicionales: usa el GITHUB_TOKEN del propio workflow.
# Imagen resultante: ghcr.io/efraingon/sistema-pago-api:latest

name: Build API (imagen Docker)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/azure-api.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/efraingon/sistema-pago-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Avisa a App Service para que descargue la imagen :latest y reinicie.
      # El secreto AZURE_WEBAPP_CD_URL se obtiene con:
      #   az webapp deployment container show-cd-url -n monrys-api -g monrys-rg
      - name: Redesplegar en Azure App Service
        env:
          CD_URL: ${{ secrets.AZURE_WEBAPP_CD_URL }}
        run: |
          if [ -z "$CD_URL" ]; then
            echo "::warning::Falta el secreto AZURE_WEBAPP_CD_URL. Reinicia la app a mano en Azure."
            exit 0
          fi
          echo "Disparando webhook de despliegue..."
          curl -fsS -X POST --retry 3 --retry-delay 5 "$CD_URL"
          echo "App Service notificado."
